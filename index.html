<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌加法大挑戰 (Card Math Game)</title>
    <!-- Tailwind CSS for modern, beautiful UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Fredoka for playful kid-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background: url('https://pmath-lab.github.io/number18/background.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive Wrapper to scale the entire UI proportionally on mobile and desktop */
        #game-viewport {
            width: 480px;
            height: 800px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
            transform-origin: center center;
        }

        .card-hover {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(250, 204, 21, 0.6); }
            50% { box-shadow: 0 0 35px rgba(250, 204, 21, 1); }
        }
        .target-glow {
            animation: pulse-glow 2s infinite;
        }
        /* Vibrant Kid-Friendly Card Styling */
        .sts-card {
            background: transparent;
            border: none;
            box-shadow: -4px 8px 25px rgba(0,0,0,0.4);
            position: relative;
            border-radius: 1rem;
        }
        .sts-energy {
            display: none;
        }

        /* Target Hit Effect (Shake instead of scale up) */
        @keyframes targetHit {
            0%, 100% { transform: scale(2.2) translate(0, 0) rotate(0deg); filter: contrast(1.1) brightness(1.05); }
            15% { transform: scale(2.2) translate(-10px, -4px) rotate(-6deg); filter: contrast(1.4) brightness(1.4) drop-shadow(0 0 20px rgba(244, 63, 94, 0.9)); }
            30% { transform: scale(2.2) translate(10px, 4px) rotate(6deg); }
            45% { transform: scale(2.2) translate(-8px, 2px) rotate(-4deg); filter: contrast(1.4) brightness(1.4) drop-shadow(0 0 20px rgba(244, 63, 94, 0.9)); }
            60% { transform: scale(2.2) translate(8px, -2px) rotate(4deg); }
            75% { transform: scale(2.2) translate(-4px, 0px) rotate(-2deg); }
            90% { transform: scale(2.2) translate(4px, 0px) rotate(2deg); }
        }
        .target-hit-anim {
            animation: targetHit 0.45s ease-in-out !important;
        }

        /* Auto remove white background for target card images */
        .auto-remove-bg {
            mix-blend-mode: multiply;
            filter: contrast(1.1) brightness(1.05);
            background-color: transparent !important;
        }

        /* Floating animation for target card image (preserving 2.2x scale) */
        @keyframes floatAnim {
            0%, 100% { transform: scale(2.2) translateY(0px); }
            50% { transform: scale(2.2) translateY(-5px); }
        }
        .target-floating {
            animation: floatAnim 3s ease-in-out infinite;
        }

        /* Level Up Pop Animation */
        @keyframes levelUpPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            70% { transform: scale(0.95) rotate(-2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .level-up-anim {
            animation: levelUpPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Lightning bolt flash animation */
        @keyframes lightningFlash {
            0% { opacity: 0.2; filter: brightness(3); }
            50% { opacity: 1; filter: brightness(5) drop-shadow(0 0 15px #facc15); }
            100% { opacity: 0; }
        }
        .lightning-bolt {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(90deg, #facc15, #ffffff, #3b82f6);
            height: 4px;
            transform-origin: left center;
            animation: lightningFlash 0.35s ease-out forwards;
        }

        /* Sequential highlight glow animation for verification */
        @keyframes stepGlow {
            0% { transform: scale(1); box-shadow: 0 0 0px rgba(225, 29, 72, 0); filter: brightness(1); }
            50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(225, 29, 72, 1); filter: brightness(1.35); border-color: #e11d48; }
            100% { transform: scale(1); box-shadow: 0 0 0px rgba(225, 29, 72, 0); filter: brightness(1); }
        }
        .highlight-glow {
            animation: stepGlow 0.9s ease-in-out forwards !important;
            z-index: 40;
        }
    </style>
</head>
<body class="text-white select-none text-base" style="background: url('https://pmath-lab.github.io/number18/background.jpg') center/cover no-repeat;">

    <!-- Scalable Game Viewport container -->
    <div id="game-viewport">

        <!-- Header & Scoreboard (Left: Time -> Score -> Level, Right: Sound Toggle) -->
        <header class="w-full flex justify-between items-center bg-white/40 backdrop-blur-md border border-white/60 px-4 py-3 rounded-2xl shadow-xl">
            <div class="flex items-center space-x-2.5">
                <div class="bg-slate-900/85 border border-indigo-400 px-3.5 py-1.5 rounded-xl shadow-inner flex items-center">
                    <span class="text-sm font-black text-indigo-200 tracking-wide">時間：<span id="timer" class="text-white font-black">60</span>秒</span>
                </div>
                <div class="bg-slate-900/85 border border-yellow-400 px-3.5 py-1.5 rounded-xl shadow-inner flex items-center">
                    <span class="text-sm font-black text-yellow-200 tracking-wide">分數：<span id="score" class="text-yellow-400 font-black">0</span>分</span>
                </div>
                <div id="level-badge" class="hidden bg-gradient-to-r from-amber-500 to-rose-500 border border-yellow-200 px-2.5 py-1 rounded-xl shadow-lg">
                    <span class="text-xs font-black text-white tracking-wider">LV.2</span>
                </div>
            </div>
            <button id="sound-toggle-btn" onclick="toggleSound()" class="bg-slate-900/85 hover:bg-slate-800 border border-pink-400 w-10 h-10 rounded-xl flex items-center justify-center text-lg text-white shadow-inner transition" title="開關音效">
                🔊
            </button>
        </header>

        <!-- Main Game Area -->
        <main class="w-full flex flex-col items-center justify-center my-auto space-y-4">
            <!-- Target Number Display -->
            <div class="text-center flex flex-col items-center w-full">
                
                <div class="flex items-center justify-center space-x-6 w-full px-2">
                    <!-- Left: Target Card Image (shifted down by 20px) -->
                    <div id="target-drop-zone" class="w-36 h-48 flex items-center justify-center flex-shrink-0 transform translate-y-5">
                        <img id="target-img" src="https://pmath-lab.github.io/number18/m11.png" alt="目標卡" class="w-full h-full object-contain drop-shadow-2xl auto-remove-bg transform scale-[2.2] target-floating">
                    </div>

                    <!-- Right: Large Target Number & Hearts Grid -->
                    <div class="flex flex-col items-center justify-center space-y-3 py-2">
                        <div id="target-number-text" class="text-7xl font-black text-slate-800 drop-shadow-[0_4px_12px_rgba(255,255,255,0.8)] text-center">
                            11
                        </div>
                        <!-- Hearts Grid Display -->
                        <div id="hearts-grid" class="grid grid-cols-5 gap-2 w-48 max-w-full justify-items-center">
                            <!-- Hearts generated dynamically -->
                        </div>
                    </div>
                </div>

                <div id="status-message" class="mt-4 text-sm font-black text-slate-900 h-6 transition-all duration-300 drop-shadow-[0_1px_4px_rgba(255,255,255,0.9)]">
                    將手牌移出選卡區即可拖拉，移至格子即可自動放入！
                </div>
            </div>

            <!-- Card-Sized Drop Slots (Removed white frosted background) -->
            <div class="flex flex-col items-center space-y-2 p-4 w-full">
                <div class="flex justify-between w-full px-1 items-center">
                    <span id="slot-instruction-label" class="text-sm text-slate-900 font-black uppercase tracking-wider flex items-center space-x-1 drop-shadow-[0_1px_3px_rgba(255,255,255,0.9)]">
                        <span>📥</span> <span>放入 2 張卡片</span>
                    </span>
                    <button onclick="clearSelection()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-sm font-black rounded-xl text-white shadow transition">清空重選</button>
                </div>
                <!-- Equation Layout: Grid 1, Plus, Grid 2, and Confirm Button / Result -->
                <div id="equation-container" class="flex items-center space-x-3 transition-all duration-300 py-1">
                    <!-- Slot 1 -->
                    <div id="slot-1" 
                         class="w-24 h-36 rounded-2xl border-3 border-dashed border-slate-700/60 flex flex-col items-center justify-center font-black text-sm bg-indigo-950/40 text-yellow-200 transition-all duration-300 shadow-inner">
                        <span class="opacity-90 font-black text-slate-200 mb-1 drop-shadow">格子 1</span>
                        <span class="text-slate-200">-</span>
                    </div>
                    
                    <!-- Plus Sign (+50% size: text-4xl text-slate-900) -->
                    <div id="plus-sign" class="text-4xl font-black text-slate-900 drop-shadow-[0_1px_4px_rgba(255,255,255,0.9)] transition-all duration-300 opacity-0 scale-75">
                        +
                    </div>

                    <!-- Slot 2 -->
                    <div id="slot-2" 
                         class="w-24 h-36 rounded-2xl border-3 border-dashed border-slate-700/60 flex flex-col items-center justify-center font-black text-sm bg-indigo-950/40 text-yellow-200 transition-all duration-300 shadow-inner">
                        <span class="opacity-90 font-black text-slate-200 mb-1 drop-shadow">格子 2</span>
                        <span class="text-slate-200">-</span>
                    </div>

                    <!-- Confirm Button (Always visible initially, hides during evaluation) -->
                    <button id="confirm-btn" onmouseenter="hideFloatingCard()" onclick="submitAnswer()" class="flex flex-col items-center justify-center w-24 h-36 bg-gradient-to-b from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-lg rounded-2xl shadow-xl transition transform active:scale-95 border-2 border-yellow-200">
                        <span class="text-3xl mb-1">✅</span>
                        <span>確定</span>
                    </button>

                    <!-- Result Display Area -->
                    <div id="result-display" class="hidden items-center space-x-3 transition-all duration-300">
                        <!-- Equal Sign (text-4xl text-slate-900) -->
                        <span id="equal-sign" class="text-4xl font-black text-slate-900 drop-shadow-[0_1px_4px_rgba(255,255,255,0.9)] opacity-40 transition-all duration-300">=</span>
                        <div id="result-box" class="w-24 h-36 rounded-2xl border-3 border-yellow-400/40 bg-yellow-500/10 flex flex-col items-center justify-center font-black text-2xl text-yellow-200/40 shadow-2xl transition-all duration-300">
                            <!-- Increased font size by 30%: text-4xl -->
                            <span id="result-value" class="text-4xl font-black">?</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer Hand (1 to 9 Cards) -->
        <footer id="hand-footer" class="w-full bg-indigo-950/80 backdrop-blur-md border border-white/30 p-3 rounded-3xl shadow-2xl relative">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-sm font-black text-yellow-200 tracking-wider flex items-center space-x-1">
                    <span>🌈</span> <span>手牌區 (數字 1-9 可重複使用)</span>
                </span>
                <button onclick="shuffleCards()" class="text-sm text-yellow-300 hover:text-yellow-200 font-bold flex items-center space-x-1 transition bg-amber-600/80 hover:bg-amber-600 px-3 py-1 rounded-xl border border-yellow-300 shadow">
                    <span>🔄 換目標</span>
                </button>
            </div>
            <!-- Slay the Spire Hand Container -->
            <div id="cards-container" class="flex justify-center items-end h-28 -space-x-8 px-1 pb-1 overflow-visible">
                <!-- Cards will be dynamically injected here -->
            </div>
        </footer>

    </div>

    <!-- Floating card following mouse / finger -->
    <div id="floating-card" class="fixed pointer-events-none z-50 hidden w-28 h-40 flex flex-col items-center justify-between shadow-2xl opacity-95 scale-[1.5] transform -translate-x-1/2 -translate-y-full">
        <img id="float-img" src="" alt="預覽卡" class="w-full h-full object-contain drop-shadow-2xl">
    </div>

    <!-- LEVEL UP Overlay Modal -->
    <div id="level-up-modal" class="fixed inset-0 bg-indigo-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4 pointer-events-none">
        <div class="level-up-anim bg-gradient-to-b from-amber-400 via-orange-500 to-rose-600 border-4 border-yellow-200 p-8 rounded-3xl text-center shadow-[0_0_60px_rgba(250,204,21,0.9)] max-w-sm w-full">
            <div class="text-6xl mb-2">⚡🔥⚡</div>
            <h2 id="level-up-title" class="text-5xl font-black text-white tracking-wider drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)] mb-3">LEVEL UP!!</h2>
            <p id="level-up-desc" class="text-yellow-100 text-lg font-black drop-shadow">
                怪獸開始主動出牌了！<br>用「減法」找出第 2 張卡吧！
            </p>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="fixed inset-0 bg-indigo-950/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-indigo-900 border-2 border-yellow-400 max-w-sm w-full p-6 rounded-3xl text-center shadow-2xl">
            <div class="text-6xl mb-3">🏆</div>
            <h2 class="text-2xl font-black text-white mb-2">時間到！遊戲結束</h2>
            <p class="text-yellow-200 text-base mb-4 font-bold">你總共獲得了以下分數：</p>
            <div id="final-score" class="text-6xl font-black text-yellow-400 mb-6 drop-shadow">0</div>
            <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-lg rounded-2xl shadow-xl transition">
                再玩一次！
            </button>
        </div>
    </div>

    <!-- Instructions Modal with Difficulty Selection -->
    <div id="start-modal" class="fixed inset-0 bg-indigo-950/85 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-indigo-900 border-2 border-yellow-400 max-w-md w-full p-6 md:p-8 rounded-3xl shadow-2xl text-center">
            <div class="text-5xl mb-3">⭐</div>
            <h2 class="text-3xl font-black text-yellow-300 mb-3 drop-shadow">卡牌加法大挑戰</h2>
            <p class="text-yellow-100 text-sm leading-relaxed mb-5 font-bold">
                請選擇遊戲難度，將手牌放入格子中合成目標數字！限時 60 秒！
            </p>

            <!-- Difficulty Selection Buttons Stacked Vertically -->
            <div class="flex flex-col space-y-2.5 mb-6">
                <button onclick="selectDifficulty('easy')" id="diff-easy" class="py-3 px-4 bg-indigo-950 hover:bg-indigo-800 border-2 border-indigo-400 rounded-2xl text-white font-black text-sm transition shadow-inner flex justify-between items-center">
                    <span>初級 (5的合成)</span>
                    <span class="text-xs text-indigo-300 font-normal">卡1-4 / 目標2-5</span>
                </button>
                <button onclick="selectDifficulty('medium')" id="diff-medium" class="py-3 px-4 bg-amber-600 border-2 border-yellow-300 rounded-2xl text-white font-black text-sm transition shadow-lg ring-2 ring-yellow-400 flex justify-between items-center">
                    <span>中級 (10的合成)</span>
                    <span class="text-xs text-yellow-100 font-normal">卡1-9 / 目標2-10</span>
                </button>
                <button onclick="selectDifficulty('hard')" id="diff-hard" class="py-3 px-4 bg-indigo-950 hover:bg-indigo-800 border-2 border-indigo-400 rounded-2xl text-white font-black text-sm transition shadow-inner flex justify-between items-center">
                    <span>高級 (18的合成)</span>
                    <span class="text-xs text-indigo-300 font-normal">卡1-9 / 目標2-18</span>
                </button>
            </div>

            <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-xl rounded-2xl shadow-2xl shadow-yellow-400/30 transition">
                開始遊戲！
            </button>
        </div>
    </div>

    <script>
        // Auto-scaling viewport to fit any phone screen size perfectly without scrolling
        function resizeGame() {
            const viewport = document.getElementById('game-viewport');
            const targetWidth = 480;
            const targetHeight = 800;
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const scaleX = windowWidth / targetWidth;
            const scaleY = windowHeight / targetHeight;
            const scale = Math.min(scaleX, scaleY, 1.1);

            viewport.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('DOMContentLoaded', resizeGame);

        // Web Audio API Synthesizer for Game Sound Effects
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle-btn');
            if (btn) btn.innerText = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) {
                initAudio();
                playSound('select');
            }
        }

        function playSound(type, stepIndex = 0) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'select') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'drop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(650, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'step') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(480 + stepIndex * 120, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'correct') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.25);
                });
            } else if (type === 'fly') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(920, now + 0.45);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.28);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.28);
            } else if (type === 'heart') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const pitch = 600 + (stepIndex % 18) * 35;
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.08);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            } else if (type === 'wrong') {
                [300, 220].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.18);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.18 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.18);
                    osc.stop(now + idx * 0.18 + 0.22);
                });
            } else if (type === 'levelup') {
                [440, 554.37, 659.25, 880, 1108.73, 1318.51].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.35);
                });
            }
        }

        // Game State Variables & Data Definitions
        let score = 0;
        let timeLeft = 60;
        let currentLevel = 1;
        let isLevel2 = false;
        let isLevel3 = false;
        let isLevelingUp = false;
        let gameActive = false;
        let isEvaluating = false;
        let targetNumber = 11;
        let currentDifficulty = 'medium'; // Default difficulty
        let isDraggingCard = false;
        let lastHoveredCardValue = null;
        let lastHoveredCardImg = null;
        let droppedCards = [null, null];
        let disabledHandValues = new Set();
        let timerInterval = null;

        const allHandCards = [
            { value: 1, img: "https://pmath-lab.github.io/number18/p1.png" },
            { value: 2, img: "https://pmath-lab.github.io/number18/p2.png" },
            { value: 3, img: "https://pmath-lab.github.io/number18/p3.png" },
            { value: 4, img: "https://pmath-lab.github.io/number18/p4.png" },
            { value: 5, img: "https://pmath-lab.github.io/number18/p5.png" },
            { value: 6, img: "https://pmath-lab.github.io/number18/p6.png" },
            { value: 7, img: "https://pmath-lab.github.io/number18/p7.png" },
            { value: 8, img: "https://pmath-lab.github.io/number18/p8.png" },
            { value: 9, img: "https://pmath-lab.github.io/number18/p9.png" }
        ];

        let handCards = [...allHandCards];

        // Ensure selectDifficulty is globally accessible
        window.selectDifficulty = function(diff) {
            initAudio();
            playSound('select');
            currentDifficulty = diff;

            ['easy', 'medium', 'hard'].forEach(d => {
                const btn = document.getElementById(`diff-${d}`);
                if (btn) {
                    if (d === diff) {
                        btn.className = "py-3 px-4 bg-amber-600 border-2 border-yellow-300 rounded-2xl text-white font-black text-sm transition shadow-lg ring-2 ring-yellow-400 flex justify-between items-center";
                    } else {
                        btn.className = "py-3 px-4 bg-indigo-950 hover:bg-indigo-800 border-2 border-indigo-400 rounded-2xl text-white font-black text-sm transition shadow-inner flex justify-between items-center";
                    }
                }
            });

            if (diff === 'easy') {
                handCards = allHandCards.slice(0, 4);
            } else {
                handCards = allHandCards.slice(0, 9);
            }
        };

        window.startGame = function() {
            initAudio();
            playSound('correct');
            const startModal = document.getElementById('start-modal');
            if (startModal) startModal.style.display = 'none';
            score = 0;
            timeLeft = 60;
            currentLevel = 1;
            isLevel2 = false;
            isLevel3 = false;
            gameActive = true;
            isEvaluating = false;
            droppedCards = [null, null];
            disabledHandValues.clear();

            const scoreEl = document.getElementById('score');
            const timerEl = document.getElementById('timer');
            const lvlBadge = document.getElementById('level-badge');
            if (scoreEl) scoreEl.innerText = score;
            if (timerEl) timerEl.innerText = timeLeft;
            if (lvlBadge) lvlBadge.classList.add('hidden');

            if (currentDifficulty === 'easy') {
                handCards = allHandCards.slice(0, 4);
            } else {
                handCards = [...allHandCards];
            }

            generateTarget();
            initHand();
            updateSlots();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive || isEvaluating || isLevelingUp) return;
                timeLeft--;
                const timerDisplay = document.getElementById('timer');
                if (timerDisplay) timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    const finalScoreEl = document.getElementById('final-score');
                    const gameOverModal = document.getElementById('game-over-modal');
                    if (finalScoreEl) finalScoreEl.innerText = score;
                    if (gameOverModal) {
                        gameOverModal.classList.remove('hidden');
                        gameOverModal.classList.add('flex');
                    }
                    playSound('wrong');
                }
            }, 1000);
        };

        window.restartGame = function() {
            const gameOverModal = document.getElementById('game-over-modal');
            if (gameOverModal) {
                gameOverModal.classList.add('hidden');
                gameOverModal.classList.remove('flex');
            }
            window.startGame();
        };

        window.shuffleCards = function() {
            initAudio();
            playSound('select');
            generateTarget();
        };

        window.clearSelection = function() {
            if (isEvaluating) return;
            initAudio();
            playSound('select');
            if ((currentLevel === 2 || currentLevel === 3) && monsterActiveCard) {
                droppedCards = [monsterActiveCard, null];
            } else {
                droppedCards = [null, null];
            }
            updateSlots();
            const msg = document.getElementById('status-message');
            if (msg) msg.innerText = "已清空選卡，請重新放入卡片！";
        };

        // Store monster's active card persistently for level 2 and 3
        let monsterActiveCard = null;

        // Animate monster playing the first card into Slot 1 in Level 2 & 3
        function animateMonsterPlayCard(cardObj) {
            monsterActiveCard = cardObj;
            const targetZone = document.getElementById('target-drop-zone');
            const slot1 = document.getElementById('slot-1');
            if (!targetZone || !slot1) {
                droppedCards[0] = cardObj;
                updateSlots();
                return;
            }

            isEvaluating = true;
            const targetRect = targetZone.getBoundingClientRect();
            const slotRect = slot1.getBoundingClientRect();

            const dx = (slotRect.left + slotRect.width / 2) - (targetRect.left + targetRect.width / 2);
            const dy = (slotRect.top + slotRect.height / 2) - (targetRect.top + targetRect.height / 2);

            const flyer = document.createElement('div');
            flyer.style.position = 'fixed';
            flyer.style.left = (targetRect.left + targetRect.width / 2 - slotRect.width / 2) + 'px';
            flyer.style.top = (targetRect.top + targetRect.height / 2 - slotRect.height / 2) + 'px';
            flyer.style.width = slotRect.width + 'px';
            flyer.style.height = slotRect.height + 'px';
            flyer.style.zIndex = '9999';
            flyer.style.pointerEvents = 'none';
            flyer.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            flyer.style.transform = 'translate(0px, 0px) scale(0.3)';
            flyer.innerHTML = `<img src="${cardObj.img}" class="w-full h-full object-contain drop-shadow-2xl">`;
            document.body.appendChild(flyer);

            playSound('fly');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flyer.style.transform = `translate(${-dx}px, ${-dy}px) scale(1)`;
                });
            });

            setTimeout(() => {
                flyer.remove();
                droppedCards[0] = cardObj;
                updateSlots();
                isEvaluating = false;
            }, 500);
        }

        // Function to generate a new target number and update the image & hearts
        function generateTarget() {
            let minTarget = 2;
            let maxTarget = 18;
            let maxCardVal = 9;

            if (currentDifficulty === 'easy') {
                minTarget = 2;
                maxTarget = 5;
                maxCardVal = 4;
            } else if (currentDifficulty === 'medium') {
                minTarget = 2;
                maxTarget = 10;
                maxCardVal = 9;
            } else {
                minTarget = 2;
                maxTarget = 18;
                maxCardVal = 9;
            }

            let nextTarget = Math.floor(Math.random() * (maxTarget - minTarget + 1)) + minTarget;
            while (nextTarget === targetNumber) {
                nextTarget = Math.floor(Math.random() * (maxTarget - minTarget + 1)) + minTarget;
            }
            targetNumber = nextTarget;

            const targetImg = document.getElementById('target-img');
            if (targetImg) {
                targetImg.src = `https://pmath-lab.github.io/number18/m${targetNumber}.png`;
            }

            const targetNumText = document.getElementById('target-number-text');
            if (targetNumText) {
                targetNumText.innerText = targetNumber;
            }

            const heartsGrid = document.getElementById('hearts-grid');
            if (heartsGrid) {
                heartsGrid.innerHTML = '';
                const maxHearts = currentDifficulty === 'easy' ? 5 : (currentDifficulty === 'medium' ? 10 : 18);
                heartsGrid.className = currentDifficulty === 'easy' ? "grid grid-cols-5 gap-2 w-48 max-w-full justify-items-center" : (currentDifficulty === 'medium' ? "grid grid-cols-5 gap-2 w-48 max-w-full justify-items-center" : "grid grid-cols-6 gap-2 w-52 max-w-full justify-items-center");
                
                for (let i = 0; i < maxHearts; i++) {
                    const heartEl = document.createElement('span');
                    if (i < targetNumber) {
                        heartEl.className = "text-xl sm:text-2xl text-rose-400 drop-shadow-md transform scale-125 transition-all";
                        heartEl.innerHTML = "❤️";
                    } else {
                        heartEl.className = "text-xl sm:text-2xl text-white/20 select-none";
                        heartEl.innerHTML = "🤍";
                    }
                    heartsGrid.appendChild(heartEl);
                }
            }

            disabledHandValues.clear();
            if (currentLevel === 3 && currentDifficulty !== 'easy') {
                // Pick valid pairs that sum to targetNumber from available handCards
                let possiblePairs = [];
                for (let i = 0; i < handCards.length; i++) {
                    for (let j = i + 1; j < handCards.length; j++) {
                        if (handCards[i].value + handCards[j].value === targetNumber) {
                            possiblePairs.push([handCards[i].value, handCards[j].value]);
                        }
                    }
                }
                if (possiblePairs.length > 0) {
                    const safePair = possiblePairs[Math.floor(Math.random() * possiblePairs.length)];
                    let candidateCards = handCards.filter(c => c.value !== safePair[0] && c.value !== safePair[1]);
                    candidateCards.sort(() => Math.random() - 0.5);
                    
                    let numToDisable = Math.min(candidateCards.length, Math.floor(Math.random() * 3) + 2);
                    let newlyDisabled = [];
                    for (let k = 0; k < numToDisable; k++) {
                        newlyDisabled.push(candidateCards[k].value);
                    }

                    // Render hand normally first, then trigger lightning animation
                    initHand(false);
                    setTimeout(() => {
                        animateLightningStrikes(newlyDisabled);
                    }, 100);
                } else {
                    initHand(true);
                }
            } else {
                initHand(true);
            }

            if (currentLevel === 2) {
                const minCard1 = Math.max(1, targetNumber - maxCardVal);
                const maxCard1 = Math.min(maxCardVal, targetNumber - 1);
                let monsterVal = Math.floor(Math.random() * (maxCard1 - minCard1 + 1)) + minCard1;
                let monsterCard = handCards.find(c => c.value === monsterVal);
                if (!monsterCard && handCards.length > 0) {
                    monsterCard = handCards[0];
                }
                droppedCards = [null, null];
                updateSlots();
                if (monsterCard) {
                    animateMonsterPlayCard({ value: monsterCard.value, img: monsterCard.img, isMonsterGenerated: true });
                }
            } else {
                monsterActiveCard = null;
                droppedCards = [null, null];
                updateSlots();
            }
        }

        // Animate lightning from monster center to disabled cards in hand
        function animateLightningStrikes(disabledVals) {
            disabledVals.forEach(val => disabledHandValues.add(val));
            const targetImg = document.getElementById('target-img');
            const container = document.getElementById('cards-container');
            if (!targetImg || !container) {
                initHand(true);
                return;
            }

            const targetRect = targetImg.getBoundingClientRect();
            const startX = targetRect.left + targetRect.width / 2;
            const startY = targetRect.top + targetRect.height / 2;

            const cardElements = container.children;
            playSound('hit');

            Array.from(cardElements).forEach((cardEl, idx) => {
                const cardObj = handCards[idx];
                if (cardObj && disabledVals.includes(cardObj.value)) {
                    const cardRect = cardEl.getBoundingClientRect();
                    const endX = cardRect.left + cardRect.width / 2;
                    const endY = cardRect.top + cardRect.height / 2;

                    // Draw lightning line
                    const length = Math.hypot(endX - startX, endY - startY);
                    const angle = Math.atan2(endY - startY, endX - startX) * (180 / Math.PI);

                    const bolt = document.createElement('div');
                    bolt.className = 'lightning-bolt';
                    bolt.style.left = startX + 'px';
                    bolt.style.top = startY + 'px';
                    bolt.style.width = length + 'px';
                    bolt.style.transform = `rotate(${angle}deg)`;
                    document.body.appendChild(bolt);

                    setTimeout(() => bolt.remove(), 350);
                }
            });

            // Refresh hand to apply gray/disabled overlay after lightning strikes
            setTimeout(() => {
                initHand(true);
            }, 300);
        }

        function initHand(enableEvents = true) {
            const container = document.getElementById('cards-container');
            if (!container) return;
            container.innerHTML = '';

            const total = handCards.length;
            handCards.forEach((card, index) => {
                const centerIdx = (total - 1) / 2;
                const offsetFromCenter = index - centerIdx;
                const rotationDeg = offsetFromCenter * 3.5; 
                const translateYPx = Math.pow(Math.abs(offsetFromCenter), 1.4) * 0.8; 

                const isDisabled = disabledHandValues.has(card.value);

                const cardEl = document.createElement('div');
                cardEl.className = `card-hover sts-card w-14 h-20 sm:w-16 sm:h-24 flex flex-col items-center justify-center ${isDisabled ? 'opacity-40 grayscale cursor-not-allowed' : 'cursor-pointer'} relative select-none`;
                cardEl.style.transform = `rotate(${rotationDeg}deg) translateY(${translateYPx}px)`;
                cardEl.style.transformOrigin = `bottom center`;

                cardEl.innerHTML = `
                    <img src="${card.img}" alt="卡${card.value}" class="w-full h-full object-contain drop-shadow-lg" onerror="this.onerror=null;this.src='https://placehold.co/60x80/4f46e5/facc15?text=${card.value}'">
                    ${isDisabled ? '<div class="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center text-xl">⚡</div>' : ''}
                `;

                if (!isDisabled && enableEvents) {
                    cardEl.addEventListener('mouseenter', (e) => {
                        if (!gameActive || isEvaluating) return;
                        if (lastHoveredCardValue !== card.value) {
                            playSound('select');
                        }
                        lastHoveredCardValue = card.value;
                        lastHoveredCardImg = card.img;
                        isDraggingCard = true;
                        showFloatingCard(card.value, card.img, e.clientX, e.clientY);

                        const allCards = container.children;
                        for (let i = 0; i < allCards.length; i++) {
                            if (i < index) {
                                const diff = index - i;
                                allCards[i].style.transform = `rotate(${(i - centerIdx) * 3.5}deg) translateY(${Math.pow(Math.abs(i - centerIdx), 1.4) * 0.8}px) translateX(-${diff * 6}px) scale(1)`;
                            } else if (i > index) {
                                const diff = i - index;
                                allCards[i].style.transform = `rotate(${(i - centerIdx) * 3.5}deg) translateY(${Math.pow(Math.abs(i - centerIdx), 1.4) * 0.8}px) translateX(${diff * 6}px) scale(1)`;
                            } else {
                                allCards[i].style.transform = `rotate(0deg) translateY(-6px) scale(1.3) translateX(0px)`;
                                allCards[i].style.zIndex = '50';
                            }
                        }
                    });

                    cardEl.addEventListener('mouseleave', () => {
                        cardEl.style.zIndex = '1';
                    });
                }

                container.appendChild(cardEl);
            });
        }

        document.addEventListener('mousemove', (e) => {
            if (!gameActive || isEvaluating || !isDraggingCard || lastHoveredCardValue === null) return;
            handleDragMove(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if (!gameActive || isEvaluating) return;
            const touch = e.touches[0];
            
            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            if (elem && elem.closest('#confirm-btn')) {
                hideFloatingCard();
                return;
            }

            if (elem) {
                const cardEl = elem.closest('.sts-card');
                if (cardEl && cardEl.parentNode.id === 'cards-container') {
                    const imgEl = cardEl.querySelector('img');
                    if (imgEl) {
                        const cardObj = handCards.find(c => imgEl.src.includes(`p${c.value}.png`) || imgEl.alt.includes(c.value));
                        if (cardObj) {
                            if (lastHoveredCardValue !== cardObj.value) {
                                playSound('select');
                            }
                            lastHoveredCardValue = cardObj.value;
                            lastHoveredCardImg = cardObj.img;
                            isDraggingCard = true;
                            showFloatingCard(lastHoveredCardValue, lastHoveredCardImg, touch.clientX, touch.clientY);
                        }
                    }
                }
            }

            if (isDraggingCard && lastHoveredCardValue !== null) {
                handleDragMove(touch.clientX, touch.clientY);
            }
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            if (!gameActive || isEvaluating) return;
            const touch = e.changedTouches[0];
            if (lastHoveredCardValue !== null) {
                const slot1 = document.getElementById('slot-1');
                const slot2 = document.getElementById('slot-2');
                const rect1 = slot1.getBoundingClientRect();
                const rect2 = slot2.getBoundingClientRect();

                if (touch.clientX >= rect1.left && touch.clientX <= rect1.right && touch.clientY >= rect1.top && touch.clientY <= rect1.bottom) {
                    if (currentLevel === 2 && monsterActiveCard) {
                        return;
                    }
                    if (currentLevel === 3 && monsterActiveCard) {
                        droppedCards[1] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                    } else {
                        droppedCards[0] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                    }
                    playSound('drop');
                    updateSlots();
                } else if (touch.clientX >= rect2.left && touch.clientX <= rect2.right && touch.clientY >= rect2.top && touch.clientY <= rect2.bottom) {
                    droppedCards[1] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                    playSound('drop');
                    updateSlots();
                }
            }
            hideFloatingCard();
            isDraggingCard = false;
        });

        function checkIfComplete() {
            // Auto check disabled, now waiting for Confirm button click
        }

        window.submitAnswer = function() {
            if (isEvaluating || droppedCards[0] === null || droppedCards[1] === null) return;
            isEvaluating = true;
            runEvaluationAnimation();
        };

        function handleDragMove(clientX, clientY) {
            const elem = document.elementFromPoint(clientX, clientY);
            if (elem && elem.closest('#confirm-btn')) {
                hideFloatingCard();
                return;
            }

            const floatCard = document.getElementById('floating-card');
            floatCard.style.display = 'flex';
            floatCard.style.left = clientX + 'px';
            floatCard.style.top = (clientY - 20) + 'px';

            const slot1 = document.getElementById('slot-1');
            const slot2 = document.getElementById('slot-2');
            const rect1 = slot1.getBoundingClientRect();
            const rect2 = slot2.getBoundingClientRect();

            if (clientX >= rect1.left && clientX <= rect1.right && clientY >= rect1.top && clientY <= rect1.bottom) {
                if (currentLevel === 2 && monsterActiveCard) {
                    return;
                }
                if (currentLevel === 3 && monsterActiveCard) {
                    droppedCards[1] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                } else {
                    droppedCards[0] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                }
                playSound('drop');
                hideFloatingCard();
                updateSlots();
            } else if (clientX >= rect2.left && clientX <= rect2.right && clientY >= rect2.top && clientY <= rect2.bottom) {
                droppedCards[1] = { value: lastHoveredCardValue, img: lastHoveredCardImg };
                playSound('drop');
                hideFloatingCard();
                updateSlots();
            }
        }

        function showFloatingCard(val, imgUrl, clientX, clientY) {
            document.getElementById('float-img').src = imgUrl;
            const floatCard = document.getElementById('floating-card');
            floatCard.style.display = 'flex';
            floatCard.style.left = (clientX || 0) + 'px';
            floatCard.style.top = ((clientY || 0) - 20) + 'px';
        }

        function hideFloatingCard() {
            document.getElementById('floating-card').style.display = 'none';
            isDraggingCard = false;
            lastHoveredCardValue = null;
            lastHoveredCardImg = null;

            const container = document.getElementById('cards-container');
            if (container) {
                const total = container.children.length;
                const centerIdx = (total - 1) / 2;
                Array.from(container.children).forEach((child, i) => {
                    const origOffset = i - centerIdx;
                    child.style.transform = `rotate(${origOffset * 3.5}deg) translateY(${Math.pow(Math.abs(origOffset), 1.4) * 0.8}px) translateX(0px) scale(1)`;
                    child.style.zIndex = '1';
                });
            }
        }

        function updateSlots() {
            const slot1 = document.getElementById('slot-1');
            const slot2 = document.getElementById('slot-2');
            const plusSign = document.getElementById('plus-sign');
            const resultDisplay = document.getElementById('result-display');
            const confirmBtn = document.getElementById('confirm-btn');

            // Ensure confirm button is always visible when not evaluating
            if (confirmBtn && !isEvaluating) {
                confirmBtn.style.display = 'flex';
            }

            if (droppedCards[0] !== null) {
                if (droppedCards[0].isMonsterGenerated) {
                    slot1.innerHTML = `
                        <div class="w-full h-full bg-gradient-to-br from-amber-500 via-orange-600 to-rose-700 rounded-2xl border-2 border-yellow-300 p-2 flex flex-col justify-between items-center shadow-2xl relative overflow-visible">
                            <div class="absolute -top-3 -left-3 w-12 h-12 bg-yellow-400 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-rose-900 font-black text-2xl z-30 drop-shadow">
                                ${droppedCards[0].value}
                            </div>
                            <div class="flex-1 flex items-center justify-center text-4xl drop-shadow-lg mt-3">
                                ⚔️
                            </div>
                            <div class="text-[11px] font-black text-yellow-100 tracking-wider uppercase mb-1 bg-black/30 px-2 py-0.5 rounded-md">
                                攻擊怪獸
                            </div>
                        </div>
                    `;
                } else {
                    slot1.innerHTML = `
                        <img src="${droppedCards[0].img}" alt="卡${droppedCards[0].value}" class="w-full h-full object-contain drop-shadow-md">
                    `;
                }
                slot1.className = "w-24 h-36 rounded-2xl flex flex-col items-center justify-center p-0 relative transition-all duration-300";
            } else {
                slot1.innerHTML = `
                    <span class="opacity-90 font-black text-slate-200 mb-1 drop-shadow">格子 1</span>
                    <span class="text-slate-200">-</span>
                `;
                slot1.className = "w-24 h-36 rounded-2xl border-3 border-dashed border-slate-700/60 flex flex-col items-center justify-center font-black text-sm bg-indigo-950/40 text-yellow-200 transition-all duration-300 shadow-inner";
            }

            if (droppedCards[1] !== null) {
                slot2.innerHTML = `
                    <img src="${droppedCards[1].img}" alt="卡${droppedCards[1].value}" class="w-full h-full object-contain drop-shadow-md">
                `;
                slot2.className = "w-24 h-36 rounded-2xl flex flex-col items-center justify-center p-0 relative transition-all duration-300";
            } else {
                slot2.innerHTML = `
                    <span class="opacity-90 font-black text-slate-200 mb-1 drop-shadow">格子 2</span>
                    <span class="text-slate-200">-</span>
                `;
                slot2.className = "w-24 h-36 rounded-2xl border-3 border-dashed border-slate-700/60 flex flex-col items-center justify-center font-black text-sm bg-indigo-950/40 text-yellow-200 transition-all duration-300 shadow-inner";
            }

            if (droppedCards[0] !== null || droppedCards[1] !== null) {
                plusSign.style.opacity = '1';
                plusSign.style.transform = 'scale(1)';
            } else {
                plusSign.style.opacity = '0';
                plusSign.style.transform = 'scale(0.75)';
            }
        }

        // Sequential 2-stage Attack Animation & Heart Reduction
        function flySingleCard(slotId, cardObj, callback) {
            const slotEl = document.getElementById(slotId);
            const targetZone = document.getElementById('target-drop-zone');
            const targetImg = document.getElementById('target-img');

            if (!slotEl || !targetZone || !targetImg || !cardObj) {
                if (callback) callback();
                return;
            }

            const slotRect = slotEl.getBoundingClientRect();
            const targetRect = targetImg.getBoundingClientRect();

            const flyer = document.createElement('div');
            flyer.style.position = 'fixed';
            flyer.style.left = slotRect.left + 'px';
            flyer.style.top = slotRect.top + 'px';
            flyer.style.width = slotRect.width + 'px';
            flyer.style.height = slotRect.height + 'px';
            flyer.style.zIndex = '9999';
            flyer.style.pointerEvents = 'none';
            flyer.style.transition = 'all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            if (cardObj.isMonsterGenerated) {
                flyer.innerHTML = `
                    <div class="w-full h-full bg-gradient-to-br from-amber-500 via-orange-600 to-rose-700 rounded-2xl border-2 border-yellow-300 p-2 flex flex-col justify-between items-center shadow-2xl">
                        <div class="w-10 h-10 bg-yellow-400 rounded-full border-2 border-white flex items-center justify-center text-rose-900 font-black text-xl">
                            ${cardObj.value}
                        </div>
                        <div class="text-3xl">⚔️</div>
                    </div>
                `;
            } else {
                flyer.innerHTML = `<img src="${cardObj.img}" class="w-full h-full object-contain drop-shadow-2xl">`;
            }

            document.body.appendChild(flyer);
            slotEl.style.opacity = '0';

            const dx = (targetRect.left + targetRect.width / 2) - (slotRect.left + slotRect.width / 2);
            const dy = (targetRect.top + targetRect.height / 2) - (slotRect.top + slotRect.height / 2);

            playSound('fly');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    flyer.style.transform = `translate(${dx}px, ${dy}px) scale(0.35) rotate(15deg)`;
                    flyer.style.opacity = '0.8';
                });
            });

            setTimeout(() => {
                flyer.remove();
                slotEl.style.opacity = '1';

                targetImg.classList.add('target-hit-anim');
                playSound('hit');

                setTimeout(() => {
                    targetImg.classList.remove('target-hit-anim');
                    if (callback) callback();
                }, 450);
            }, 450);
        }

        function runEvaluationAnimation() {
            const val1 = droppedCards[0].value;
            const val2 = droppedCards[1].value;
            const sum = val1 + val2;

            const confirmBtn = document.getElementById('confirm-btn');
            if (confirmBtn) confirmBtn.style.display = 'none';

            const slot1 = document.getElementById('slot-1');
            const plusSign = document.getElementById('plus-sign');
            const slot2 = document.getElementById('slot-2');
            const resultDisplay = document.getElementById('result-display');
            const equalSign = document.getElementById('equal-sign');
            const resultBox = document.getElementById('result-box');
            const resultValue = document.getElementById('result-value');
            const statusMsg = document.getElementById('status-message');

            if (statusMsg) statusMsg.innerText = "驗算中...";

            // Immediately show plus, equal sign, and result box container placeholder
            plusSign.style.opacity = '1';
            plusSign.style.transform = 'scale(1)';
            resultDisplay.classList.remove('hidden');
            resultDisplay.classList.add('flex');
            equalSign.style.opacity = '0.4';
            resultBox.className = "w-24 h-36 rounded-2xl border-3 border-slate-800/40 bg-white/40 flex flex-col items-center justify-center font-black text-2xl text-slate-900/40 shadow-2xl transition-all duration-300";
            resultValue.innerText = "?";

            // Step 1: Highlight Slot 1 for 0.9 second
            slot1.classList.add('highlight-glow');
            playSound('select');

            setTimeout(() => {
                slot1.classList.remove('highlight-glow');
                // Step 2: Highlight Plus sign for 0.9 second
                plusSign.classList.add('highlight-glow');
                playSound('select');

                setTimeout(() => {
                    plusSign.classList.remove('highlight-glow');
                    // Step 3: Highlight Slot 2 for 0.9 second
                    slot2.classList.add('highlight-glow');
                    playSound('select');

                    setTimeout(() => {
                        slot2.classList.remove('highlight-glow');
                        // Step 4: Highlight Equals sign for 0.9 second
                        equalSign.classList.add('highlight-glow');
                        equalSign.style.opacity = '1';
                        playSound('select');

                        setTimeout(() => {
                            equalSign.classList.remove('highlight-glow');
                            // Step 5: Highlight Result box & display calculated number for 0.9 second
                            resultBox.className = "w-24 h-36 rounded-2xl border-3 border-rose-600 bg-white/70 flex flex-col items-center justify-center font-black text-2xl text-slate-900 shadow-2xl highlight-glow transition-all duration-300";
                            resultValue.innerText = sum;
                            playSound('select');

                            setTimeout(() => {
                                resultBox.classList.remove('highlight-glow');

                                // Now proceed to attack animation & evaluation check
                                if (sum === targetNumber) {
                                    playSound('correct');
                                    if (statusMsg) statusMsg.innerText = `太棒了！ ${val1} + ${val2} = ${targetNumber} 成功反擊怪獸！`;

                                    const pointsEarned = Math.max(1, Math.floor(timeLeft / 6));
                                    score += pointsEarned;
                                    timeLeft = 60; // Reset time to 60s on correct answer
                                    const scoreEl = document.getElementById('score');
                                    const timerEl = document.getElementById('timer');
                                    if (scoreEl) scoreEl.innerText = score;
                                    if (timerEl) timerEl.innerText = timeLeft;

                                    flySingleCard('slot-1', droppedCards[0], () => {
                                        const hearts = document.querySelectorAll('#hearts-grid span');
                                        let heartIdx = 0;
                                        let count1 = 0;
                                        const interval1 = setInterval(() => {
                                            if (count1 < val1 && heartIdx < hearts.length) {
                                                hearts[heartIdx].innerHTML = "🖤";
                                                hearts[heartIdx].className = "text-base text-white/30 transition-all";
                                                playSound('heart', heartIdx);
                                                heartIdx++;
                                                count1++;
                                            } else {
                                                clearInterval(interval1);
                                                setTimeout(() => {
                                                    flySingleCard('slot-2', droppedCards[1], () => {
                                                        let count2 = 0;
                                                        const interval2 = setInterval(() => {
                                                            if (count2 < val2 && heartIdx < hearts.length) {
                                                                hearts[heartIdx].innerHTML = "🖤";
                                                                hearts[heartIdx].className = "text-base text-white/30 transition-all";
                                                                playSound('heart', heartIdx);
                                                                heartIdx++;
                                                                count2++;
                                                            } else {
                                                                clearInterval(interval2);
                                                                
                                                                // Check Level Up condition for LV.3 (score >= 100 && not easy)
                                                                if (score >= 100 && !isLevel3 && currentLevel === 2 && currentDifficulty !== 'easy') {
                                                                    currentLevel = 3;
                                                                    isLevel3 = true;
                                                                    isLevelingUp = true;
                                                                    playSound('levelup');

                                                                    const lvlBadge = document.getElementById('level-badge');
                                                                    if (lvlBadge) lvlBadge.innerText = "LV.3";

                                                                    const levelModal = document.getElementById('level-up-modal');
                                                                    const levelTitle = document.getElementById('level-up-title');
                                                                    const levelDesc = document.getElementById('level-up-desc');
                                                                    if (levelTitle) levelTitle.innerText = "ULTIMATE LEVEL UP!!";
                                                                    if (levelDesc) levelDesc.innerHTML = "閃電襲擊！部分手牌被雷擊變成灰色！<br>利用餘下手牌組合數字！";

                                                                    if (levelModal) {
                                                                        levelModal.classList.remove('hidden');
                                                                        levelModal.classList.add('flex');
                                                                    }

                                                                    setTimeout(() => {
                                                                        if (levelModal) {
                                                                            levelModal.classList.add('hidden');
                                                                            levelModal.classList.remove('flex');
                                                                        }
                                                                        isLevelingUp = false;
                                                                        resultDisplay.classList.add('hidden');
                                                                        monsterActiveCard = null;
                                                                        droppedCards = [null, null];
                                                                        updateSlots();
                                                                        generateTarget();
                                                                        initHand();
                                                                        isEvaluating = false;
                                                                    }, 2400);

                                                                // Check Level Up condition for LV.2 (score >= 40)
                                                                } else if (score >= 40 && !isLevel2 && currentLevel === 1) {
                                                                    currentLevel = 2;
                                                                    isLevel2 = true;
                                                                    isLevelingUp = true;
                                                                    playSound('levelup');

                                                                    const lvlBadge = document.getElementById('level-badge');
                                                                    if (lvlBadge) lvlBadge.classList.remove('hidden');

                                                                    const levelModal = document.getElementById('level-up-modal');
                                                                    const levelTitle = document.getElementById('level-up-title');
                                                                    const levelDesc = document.getElementById('level-up-desc');
                                                                    if (levelTitle) levelTitle.innerText = "LEVEL UP!!";
                                                                    if (levelDesc) levelDesc.innerHTML = "怪獸開始主動出牌了！<br>用玩家手牌打出正確算式洗走怪獸卡！";

                                                                    if (levelModal) {
                                                                        levelModal.classList.remove('hidden');
                                                                        levelModal.classList.add('flex');
                                                                    }

                                                                    setTimeout(() => {
                                                                        if (levelModal) {
                                                                            levelModal.classList.add('hidden');
                                                                            levelModal.classList.remove('flex');
                                                                        }
                                                                        isLevelingUp = false;
                                                                        resultDisplay.classList.add('hidden');
                                                                        monsterActiveCard = null;
                                                                        droppedCards = [null, null];
                                                                        updateSlots();
                                                                        generateTarget();
                                                                        isEvaluating = false;
                                                                    }, 2200);
                                                                } else {
                                                                    setTimeout(() => {
                                                                        resultDisplay.classList.add('hidden');
                                                                        if (confirmBtn) confirmBtn.style.display = 'flex';
                                                                        monsterActiveCard = null;
                                                                        droppedCards = [null, null];
                                                                        updateSlots();
                                                                        if (currentLevel === 3) {
                                                                            initHand();
                                                                        }
                                                                        generateTarget();
                                                                        isEvaluating = false;
                                                                    }, 600);
                                                                }
                                                            }
                                                        }, 180);
                                                    });
                                                }, 180);
                                            }
                                        }, 180);
                                    });

                                } else {
                                    playSound('wrong');
                                    if (statusMsg) statusMsg.innerText = `答案是 ${sum}，不對喔！再試一次！`;
                                    setTimeout(() => {
                                        resultDisplay.classList.add('hidden');
                                        if (confirmBtn) confirmBtn.style.display = 'flex';
                                        if ((currentLevel === 2 || currentLevel === 3) && monsterActiveCard) {
                                            droppedCards = [monsterActiveCard, null];
                                        } else {
                                            droppedCards = [null, null];
                                        }
                                        updateSlots();
                                        isEvaluating = false;
                                        if (statusMsg) statusMsg.innerText = "將手牌移出選卡區即可拖拉，移至格子即可自動放入！";
                                    }, 1400);
                                }
                            }, 900); // Result box highlight duration
                        }, 900); // Equals sign highlight duration
                    }, 900); // Slot 2 highlight duration
                }, 900); // Plus sign highlight duration
            }, 900); // Slot 1 highlight duration
        }
    </script>
</body>
